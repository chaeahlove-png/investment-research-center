name: Update market data

on:
  schedule:
    - cron: "30 22 * * 0-4"   # 07:30 KST (월~금 아침) · 미국 장 마감 후
    - cron: "30 9 * * 1-5"    # 18:30 KST (월~금 저녁) · ECB 기준환율 발표 후
  workflow_dispatch: {}        # Actions 탭에서 수동 실행

permissions:
  contents: write

concurrency:
  group: market-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect market data
        run: python scripts/fetch_market.py
      - name: Commit data/market.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/market.json
          git diff --cached --quiet && echo "변경 없음" && exit 0
          git commit -m "data: market update $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
